services:
  - type: web
    name: ps26227-backend-demo
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: USE_LOCAL_SQLITE_FALLBACK
        value: "true"
      - key: USE_LOCAL_QDRANT_STORAGE
        value: "true"
      - key: QDRANT_STORAGE_DIR
        value: /tmp/qdrant_storage
      - key: QDRANT_LOCAL_PATH
        value: /tmp/qdrant_storage
      - key: API_HOST
        value: 0.0.0.0